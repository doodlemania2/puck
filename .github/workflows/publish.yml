name: Publish

# Publishes packages/core to npm as @doodlemania/puck on a version tag.
# The source keeps the name @puckeditor/core so upstream merges stay clean;
# the name changes inside this job only and is never committed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    # Public repo, and npm provenance needs a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Rename and publish packages/core
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "const f='package.json',p=require('./'+f);p.name='@doodlemania/puck';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          # A tag with a hyphen (v0.24.0-doodle.1) is a pre-release. It goes to the "next" dist-tag.
          case "$REF_NAME" in *-*) TAG_ARG='--tag next' ;; *) TAG_ARG='' ;; esac
          pnpm publish --access public --provenance --no-git-checks $TAG_ARG $DRY
